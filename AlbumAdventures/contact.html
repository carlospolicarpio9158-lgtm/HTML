        <div id="container">

            <a href="index.html" class="brand"><img src="img/logo.svg" alt="" class="logo"/> Album Adventures</a>

        <main>
            <section>
                <div class="contact">
                    <h1>Contact Us</h1>
                    <p>Have an Artist/Album you would want us to explore? Contact us!</p>
                </div>
                <form class="form">
                    <h3>Send us a message</h3>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name..." required/>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email..." required/>

                    <label for="number">Contact Number</label>
                    <input type="tel" id="number" name="number" placeholder="Enter your contact number..."
                    required pattern="(09|\+639)[0-9]{2}-?[0-9]{3}-?[0-9]{4}" maxlength="15"/>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                    <p id="formmsg" role="alert"></p>
                    <div class="buttons">
                        <input type="submit" value="Submit" class="btn submit"/>
                        <input type="reset" value="Reset" class="btn reset"/>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <p class="social">
                <a href="https://www.facebook.com/" target="_blank"><img src="img/facebook.svg" alt="Facebook"/></a>
